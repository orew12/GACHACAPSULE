<!DOCTYPE html>
<html>
     <head>
          <title> GACHA CAPSULE</title>
          <style>
               #capsule {
                    width: 200px;
                    height: 200px;
                    border-radius: 50%;
               }
               #playBtn {
                    padding: 24px; 
                    background: white;
                    color: black;
                    border-radius: 30%;
                    cursor: pointer;
               }
          </style>
     </head>
     <body>
          <h1> GACHA CAPSULE </h1>
          <div id ="capsule"></div>
          <button id = "playBtn"> PLAY </button>
          <p id = "result"> </p>
     <script>
               const btn = document.getElementById("playBtn");
               const result = document.getElementById("result");
               btn.addEventlistener("click", function () {
                    console.log("clicked!");
                    result.textContent = "result";
               })
          
     </script>
     </body>
</html>
