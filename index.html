<!DOCTYPE html>
<html>
     <head>
          <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Indie+Flower&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
          <title> GACHA CAPSULE</title>
          <style>
               #playBtn {
                    padding: 24px; 
                    background: white;
                    color: black;
                    border-radius: 20%;
                    cursor: pointer;
                    text-align: center;
               }
               body { 
                    text-align: center;
                    background-color: beige;
                    padding-top: 170px;
                    font-size: 30px;
               }
               #result {
                    font-size: 1.3em;
                    margin-top: 28px;
                    min-height: 1.6em;
               }
          </style>
     </head>
     <body>
          <h1> GACHA CAPSULE </h1>
          <button id = "playBtn"> PLAY </button>
          <p id = "result"> </p>
     <script>
               const btn = document.getElementById("playBtn");
               const result = document.getElementById("result");
               btn.addEventlistener("click", function () {
                    console.log("clicked!");
                    result.textContent = "result";
               })
          
     </script>
     </body>
</html>
