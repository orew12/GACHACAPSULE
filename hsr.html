<!DOCTYPE HTML>
<html>
     <head>
          <title> HONKAI STAR RAIL </title>
     <STYLE>
          .img-btn {
               position: fixed;
               right: 20px;
               top: 20px;
               left: auto;
               z-index: 10;
               background: none;
               border: none;
               cursor: pointer;
          }
          .img-btn img {
               width: 60px;
               height: auto;
               display: block;
          }
          .popout {
               display: none;
               position: fixed;
               inset: 0;
               background: rgba(0,0,0,0.7);
               z-index: 100;
               justify-content: center;
               align-items: center;
          }
          .popout.show {
               display: flex;
          }

          .popout-box {
               background: #fff;
               color: #222;
               padding: 30px;
               border-radius: 12px;
               max-width: 500px;
               width: 90%;
               position: relative;
               text-align: center;
          }
          .close-btn {
               position: absolute;
               top: 8px;
               right: 12px;
               background: none;
               border: none;
               font-size: 28px;
               cursor: pointer;
               line-height: 1;
          }
          body {
               background-image: url("hsrbg.jpg");
               font-family: "Indie Flower", cursive;
               background-repeat: no-repeat;
               background-size: cover;
               background-position: center;
               background-attachment: fixed;
          }
          body::before {
               inset: 0;
               z-index: -1;
               content: "";
               background: rgba(0,0,0,0.65);
               position: fixed;
          }
          .background-bag {
               border: 2px solid #222;
               border-radius: 8px;
               padding: 20px;
               min-height: 120px;
               display: flex;
               flex-wrap: wrap;
               gap: 12px;
               align-items: flex-start;
               justify-content: center;
          }
          .background-bag img {
               width: 150px;
               height: 104px;
               object-fit: contain;
               cursor: pointer;
               transition: transform 0.2s ease;
          }
          .background-bag img:hover {
               transform: scale(1.15);
          }

          .char-panel {
               position: fixed;
               left: 20px;
               top: 100px;
               width: 200px;
               padding: 14px;
               background: rgba(15,15,25,0.6);
               backdrop-filter: blur(10px);
               border: 1px solid rgba(200, 170, 255, 0.25);
               border-radius: 12px;
               z-index: 5;
               max-height: calc(100vh - 140px);
               overflow-y: auto;
          }
          .char-panel::-webkit-scrollbar {
               width: 6px;
          }
          .char-panel::-webkit-scrollbar-thumb {
               background: rgba(200,170,255,0.35);
               border-radius: 3px;
          }
          .char-panel::-webkit-scroll-bar-track {
               background: transparent;
          }
          .panel-title {
               font-size: 13px;
               letter-spacing: 3px;
               color: #d9c8ff;
               margin: 0 0 12px;
               text-align: center;
          }
          .char-grid {
               display: grid;
               grid-template-columns: repeat(2, 1fr);
               gap: 10px;
          }
          .char-card {
               position: relative;
               aspect-ratio: 3 / 4;
               border-radius: 8px;
               overflow: hidden;
               background: rgba(255,255,255, 0.06);
               border: 1px solid rgba(255,255,255, 0.15);
               cursor: pointer;
               transition: transform 0.2s ease, box-shadow 0.2s ease;
          }
          .char-card:hover {
               transform: translateY(-3px);
               box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
          }
          .char-card img {
               width: 100%;
               height: 100%;
               object-fit: cover;
               display: block;
          }
          .char-card .name {
               position: absolute;
               bottom: 0;
               left: 0;
               right: 0;padding: 4px 6px;
               font-size: 11px;
               background: linear-gradient(transparent, rgba(0,0,0, 0.85));
               color: #fff;
               text-align: center;
          }
          .char-card.locked img {
               filter: grayscale(1) brightness(0.35);
          }
          .char-card.locked::after {
               content: "locked";
               position: absolute;
               top: 50%;
               left: 50%;
               transform: translate(-50%, -50%);
               font-size: 22px;
               opacity: 0.75;
          }
          .char-card.locked .name {
               color: rgba(255,255,255,0.45);
          }
          .CAPSULE {
               text-align: center;
               
          }

     </STYLE>
     </head>
     <body>
          <div class = "CAPSULE">
               <img src = "machine.png" alt = "hsrcapsule">
          </div>
          <button class = "img-btn" id = "openPopout">
               <img src = "bag.png" alt = "bag">
          </button>

          <div class = "popout" id = "popout">
               <div class ="popout-box">
                    <button class = "close-btn" id = "closePopout">&times;</button>
                    <h3> BAG </h3>
                    <p> BACKGROUNDS </p>
                   <div class = "background-bag">
                    <img src="amphorous.jpg" data-bg="amphorous.jpg" alt="amphorous">
                    <img src="beblog.jpg" data-bg="beblog.jpg" alt="beblog">
                    <img src="The Xianzhou Luofu.jpg" data-bg="The Xianzhou Luofu.jpg" alt="The Xianzhou Luofu">
                    <img src="penacony.jpg" data-bg="penacony.jpg" alt="penacony">
                    <img src="hertastation.jpg" data-bg="hertastation.jpg" alt="hertastation">
                    <img src="Planarcadia.jpg" data-bg="Planarcadia.jpg" alt="Planarcadia">
                    </div>
               </div>
          </div>

          <aside class = "char-panel">
               <h2 class ="panel-title">CHARACTERS</h2>
               <div class = "char-grid" id = "charGrid"></div>
          </aside>
     <script>
          const popout= document.getElementById("popout");
          document.getElementById("openPopout").onclick = () => popout.classList.add("show");
          document.getElementById("closePopout").onclick = () => popout.classList.remove("show");
          
          popout.onclick = (e) => {
               if (e.target === popout) popout.classList.remove("show");
          };

          const bgImages = document.querySelectorAll(".background-bag img");
          bgImages.forEach((img) => {
               img.addEventListener("click", () => {
                    const chosen = img.dataset.bg;
                    document.body.style.backgroundImage = `url("${chosen}")`;
                    localStorage.setItem("selectedBg", chosen);
                    popout.classList.remove("show");
               });
          });

          const savedBg = localStorage.getItem("selectedBg");
          if (savedBg) {
               document.body.style.backgroundImage = `url("${savedBg}")`;
          }

          const characters = [
               { name: "Aventurine", img: "aventurine5.png", owned: false},
               { name: "Dan heng", img: "danheng.png", owned: false},
               { name: "Dan heng - 2", img: "danheng5.png", owned: false},
               { name: "Dan heng - 3", img: "danhengdragon.png", owned: false},
               { name: "Aha", img: "aha.png", owned: false},
               { name: "Serval", img: "serval.png", owned: false},
               { name: "herta", img: "herta.png", owned: false},
               { name: "Herta - Five star", img: "herta5.png", owned: false},
               { name: "Gepard", img: "gepard.png", owned: false},
               { name: "Himeko Nova", img: "himekonova.png", owned: false},
               { name: "Himeko", img: "himeko.png", owned: false},
               { name: "March 7th", img: "march7.png", owned: false},
               { name: "Evernight", img: "march7th5.png", owned: false},
          ];

          const grid = document.getElementById("charGrid");
          characters.forEach((c)=> {
               const card= document.createElement("div");
               card.className= "char-card" + (c.owned ?"" : " locked");
               card.innerHTML = `
                   <img src="${c.img}" alt="${c.name}">
                   <span class="name">${c.name}</span>
               `;
               grid.appendChild(card);
          });

     
     </script>
     </body>

</htrml>
