<!DOCTYPE HTML>
<html>
     <head>
          <title> HONKAI STAR RAIL </title>
     <STYLE>
          .img-btn {
               position: fixed;
               right: 20px;
               top: 20px;
               left: auto;
               z-index: 10;
               background: none;
               border: none;
               cursor: pointer;
          }
          .img-btn img {
               width: 60px;
               height: auto;
               display: block;
          }
          .popout {
               display: none;
               position: fixed;
               inset: 0;
               background: rgba(0,0,0,0.7);
               z-index: 100;
               justify-content: center;
               align-items: center;
          }
          .popout.show {
               display: flex;
          }

          .popout-box {
               background: #fff;
               color: #222;
               padding: 30px;
               border-radius: 12px;
               max-width: 500px;
               width: 90%;
               position: relative;
               text-align: center;
          }
          .close-btn {
               position: absolute;
               top: 8px;
               right: 12px;
               background: none;
               border: none;
               font-size: 28px;
               cursor: pointer;
               line-height: 1;
          }
          body {
               background-image: url("hsrbg.jpg");
               font-family: "Indie Flower", cursive;
               background-repeat: no-repeat;
               background-size: cover;
               background-position: center;
               background-attachment: fixed;
          }
          body::before {
               inset: 0;
               z-index: -1;
               content: "";
               background: rgba(0,0,0,0.65);
               position: fixed;
          }
          .background-bag {
               border: 2px solid #222;
               border-radius: 8px;
               padding: 20px;
               min-height: 120px;
               display: flex;
               flex-wrap: wrap;
               gap: 12px;
               align-items: flex-start;
               justify-content: center;
          }
          .background-bag img {
               width: 150px;
               height: 104px;
               object-fit: contain;
               cursor: pointer;
               transition: transform 0.2s ease;
          }
          .background-bag img:hover {
               transform: scale(1.15);
          }

          .char-panel {
               position: fixed;
               left: 20px;
               top: 100px;
               width: 200px;
               padding: 14px;
               background: rgba(15,15,25,0.6);
               backdrop-filter: blur(10px);
               border: 1px solid rgba(200, 170, 255, 0.25);
               border-radius: 12px;
               z-index: 5;
               max-height: calc(100vh - 140px);
               overflow-y: auto;
          }
          .char-panel::-webkit-scrollbar {
               width: 6px;
          }
          .char-panel::-webkit-scrollbar-thumb {
               background: rgba(200,170,255,0.35);
               border-radius: 3px;
          }
          .char-panel::-webkit-scroll-bar-track {
               background: transparent;
          }
          .panel-title {
               font-size: 13px;
               letter-spacing: 3px;
               color: #d9c8ff;
               margin: 0 0 12px;
               text-align: center;
          }
          .char-grid {
               display: grid;
               grid-template-columns: repeat(2, 1fr);
               gap: 10px;
          }
          .char-card {
               position: relative;
               aspect-ratio: 3 / 4;
               border-radius: 8px;
               overflow: hidden;
               background: rgba(255,255,255, 0.06);
               border: 1px solid rgba(255,255,255, 0.15);
               cursor: pointer;
               transition: transform 0.2s ease, box-shadow 0.2s ease;
          }
          .char-card:hover {
               transform: translateY(-3px);
               box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
          }
          .char-card img {
               width: 100%;
               height: 100%;
               object-fit: cover;
               display: block;
          }
          .char-card .name {
               position: absolute;
               bottom: 0;
               left: 0;
               right: 0;padding: 4px 6px;
               font-size: 11px;
               background: linear-gradient(transparent, rgba(0,0,0, 0.85));
               color: #fff;
               text-align: center;
          }
          .char-card.locked img {
               filter: grayscale(1) brightness(0.35);
          }
          .char-card.locked::after {
               content: "locked";
               position: absolute;
               top: 50%;
               left: 50%;
               transform: translate(-50%, -50%);
               font-size: 22px;
               opacity: 0.75;
          }
          .char-card.locked .name {
               color: rgba(255,255,255,0.45);
          }
          .CAPSULE {
               text-align: center;
          }
          .pull-stage {
               position: fixed;
               inset: 0;
               display: none;
               align-items: center;
               justify-content: center;
               z-index: 30;
               background: rgba(0,0,0,0.6);
               backdrop-filter: blur(5px);
               perspective: 1200px;
          }
          .pull-stage.show {
               display: flex;
          }
          .crack-flash {
               position: absolute;
               inset: 0;
               background: radial-gradient(circle, #fff, #c9a6ff 35%,transparent 70%);
               opacity: 0;
               pointer-events: none;
          }
          .crack-flash.burst {
               animation: burst 0.7s ease-out forwards;
          }
          @keyframes burst {
               0% {
                    opacity: 0;
                    transform: scale(0.2);
               }
               30% {
                    opacity: 1;
                    transform: scale(1);
               }
               100% {
                    opacity: 0;
                    transform: scale(2.2);
               }
          }
          .pull-ball {
               margin: -22px 0 0 -22px;
               position: absolute;
               top: 55%;
               left: 50%;
               width: 44px;
               height: 44px;
               border-radius: 50%;
               background: radial-gradient(circle at 30% 30%, #fff, #b07ce8 60%, #5a2d8a);
               box-shadow: 0 0 24px rgba(176, 124, 232, 0.9);
               opacity: 0;
          }
          .pull-ball.pop {
               animation: ballPop 1s ease-out forwards;
          }
          @keyframes ballPop {
               0% {
                    opacity: 0; 
                    transform: translateY(0) scale(0.4);
               }
               20% {
                    opacity: 1; 
                    transform: translateY(-40px) scale(1);
               }
               60% {
                    opacity: 1; 
                    transform: translateY(-90px) scale(1.05);
               }
               85% {
                    opacity: 1; 
                    transform: translateY(-90px) scale(1.4);
               }
               100% {
                    opacity: 0; 
                    transform: translateY(-90px) scale(2.4);
               }
          }
          .card-scene {
               position: relative;
               width: 220px;
               height: 300px;
               opacity: 0;
               perspective: 1200px;
          }
          .card-scene.show {
               opacity: 1;
          }
          .card-flip {
               position: relative;
               width: 100%;
               height: 100%;
               transform-style: preserve-3d;
          }
          .card-flip.flipping {
               animation: flipUp 1.2s cubic-bezier(0.3, 0.9, 0.4, 1) forwards;
          }
         @keyframes flipUp {
            0%   { transform: translateY(0) rotateY(0deg) rotateX(0deg) scale(0.5); }
            45%  { transform: translateY(-140px) rotateY(180deg) rotateX(20deg) scale(1.1); }
            60%  { transform: translateY(-150px) rotateY(270deg) rotateX(10deg) scale(1.05); }
            100% { transform: translateY(0) rotateY(180deg) rotateX(0deg) scale(1); }
             }

          .card-face {
               position: absolute;
               inset: 0;
               border-radius: 12px;
               backface-visibility: hidden;
               overflow: hidden;
          }
          .card-back {
               background: linear-gradient(135deg, #2a1b4a, #6d4bb0);
               border: 2px solid #f0c060;
               background-image: url("backcoverhsr.jpg");
               background-size: cover;
               background-position: center;
          }
          .card-front {
               transform: rotateY(180deg);
               border: 2px solid #f0c060;
               box-shadow: 0 0 40px rgba(240, 192, 96, 0.6);
               background: #111;
          }
          .card-front img {
               width: 100%;
               height: 100%;
               object-fit: cover;
               display: block;
          }
          .card-name {
               position: absolute;
               bottom: 0;
               left: 0;
               right: 0;
               padding: 8px;
               font-size: 14px;
               text-align: center;
               color: #fff;
               background: linear-gradient(transparent, rgba(0,0,0, 0.9));
          }

     </STYLE>
     </head>
     <body>
          <div class = "CAPSULE">
               <img src = "machine.png" id = "capsule" alt = "hsrcapsule">
          </div>

          <div class = "pull-stage" id = "pullStage">
               <div class = "crack-flash"id = "crackFlash"></div>
               <div class = "pull-ball" id = "pullBall"></div>

               <div class="card-scene" id = "cardScene">
                    <div class = "card-flip" id = "cardFlip">
                         <div class = "card-face card-back"></div>
                         <div class = "card-face card-front">
                              <img id = "cardImg" src ="" alt="">
                              <span class = " card-name" id = "cardName"></span>
                          </div>
                    </div>
               </div>
          </div>

          <button class = "img-btn" id = "openPopout">
               <img src = "bag.png" alt = "bag">
          </button>

          <div class = "popout" id = "popout">
               <div class ="popout-box">
                    <button class = "close-btn" id = "closePopout">&times;</button>
                    <h3> BAG </h3>
                    <p> BACKGROUNDS </p>
                   <div class = "background-bag">
                    <img src="amphorous.jpg" data-bg="amphorous.jpg" alt="amphorous">
                    <img src="beblog.jpg" data-bg="beblog.jpg" alt="beblog">
                    <img src="The Xianzhou Luofu.jpg" data-bg="The Xianzhou Luofu.jpg" alt="The Xianzhou Luofu">
                    <img src="penacony.jpg" data-bg="penacony.jpg" alt="penacony">
                    <img src="hertastation.jpg" data-bg="hertastation.jpg" alt="hertastation">
                    <img src="Planarcadia.jpg" data-bg="Planarcadia.jpg" alt="Planarcadia">
                    </div>
               </div>
          </div>

          <aside class = "char-panel">
               <h2 class ="panel-title">CHARACTERS</h2>
               <div class = "char-grid" id = "charGrid"></div>
          </aside>
     <script>
          const popout= document.getElementById("popout");
          document.getElementById("openPopout").onclick = () => popout.classList.add("show");
          document.getElementById("closePopout").onclick = () => popout.classList.remove("show");
          
          popout.onclick = (e) => {
               if (e.target === popout) popout.classList.remove("show");
          };

          const bgImages = document.querySelectorAll(".background-bag img");
          bgImages.forEach((img) => {
               img.addEventListener("click", () => {
                    const chosen = img.dataset.bg;
                    document.body.style.backgroundImage = `url("${chosen}")`;
                    localStorage.setItem("selectedBg", chosen);
                    popout.classList.remove("show");
               });
          });

          const savedBg = localStorage.getItem("selectedBg");
          if (savedBg) {
               document.body.style.backgroundImage = `url("${savedBg}")`;
          }

          const characters = [
               { name: "Aventurine", img: "aventurine5.png", owned: false},
               { name: "Dan heng", img: "danheng.png", owned: false},
               { name: "Dan heng - 2", img: "danheng5.png", owned: false},
               { name: "Dan heng - 3", img: "danhengdragon.png", owned: false},
               { name: "Aha", img: "aha.png", owned: false},
               { name: "Serval", img: "serval.png", owned: false},
               { name: "herta", img: "herta.png", owned: false},
               { name: "Herta - Five star", img: "herta5.png", owned: false},
               { name: "Gepard", img: "gepard.png", owned: false},
               { name: "Himeko Nova", img: "himekonova.png", owned: false},
               { name: "Himeko", img: "himeko.png", owned: false},
               { name: "March 7th", img: "march7.png", owned: false},
               { name: "Evernight", img: "march7th5.png", owned: false},
          ];

          const grid = document.getElementById("charGrid");
          characters.forEach((c)=> {
               const card= document.createElement("div");
               card.className= "char-card" + (c.owned ?"" : " locked");
               card.innerHTML = `
                   <img src="${c.img}" alt="${c.name}">
                   <span class="name">${c.name}</span>
               `;
               grid.appendChild(card);
          });
          const pullStage = document.getElementById("pullStage");
          const crackFlash = document.getElementById("crackFlash");
          const pullBall = document.getElementById("pullBall");
          const cardScene = document.getElementById("cardScene");
          const cardFlip = document.getElementById("cardFlip");
          const cardImg = document.getElementById("cardImg");
          const cardName = document.getElementById("cardName");

          let pulling = false;
          function startPull() {
               if (pulling) return;
               pulling = true;
               const picked = characters[Math.floor(Math.random() * characters.length)];
               cardImg.src = picked.img;
               cardName.textContent = picked.name;

               pullStage.classList.add("show");
               crackFlash.classList.remove("burst");
               pullBall.classList.remove("pop");
               cardScene.classList.remove("show");
               cardFlip.classList.remove("flipping");
               
               setTimeout(() => {
                    crackFlash.classList.add("burst");
                    pullBall.classList.add("pop");
               },200);

               setTimeout(() => {
                    cardScene.classList.add("show");
               },1000);

               setTimeout(() => {
                    cardFlip.classList.add("flipping");
                    pullBall.classList.add("pop");
               },1150);

               setTimeout(() => {
                    pullStage.addEventListener("click", closePull, { once: true});
          },2400);
          }
              function closePull() {
               pullStage.classList.remove("show");
               cardFlip.classList.remove("flipping");
               cardScene.classList.remove("show");
               pulling = false;
          }

          document.getElementById("capsule").addEventListener("click", startPull);

     
     </script>
     </body>

</html>
