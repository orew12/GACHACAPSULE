<!DOCTYPE HTML>
<html>
     <head>
          <title> HONKAI STAR RAIL </title>
     <STYLE>
          .img-btn {
               position: fixed;
               right: 20px;
               top: 20px;
               left: auto;
               z-index: 10;
               background: none;
               border: none;
               cursor: pointer;
          }
          .img-btn img {
               width: 60px;
               height: auto;
               display: block;
          }
          .popout {
               display: none;
               position: fixed;
               inset: 0;
               background: rgba(0,0,0,0.7);
               z-index: 100;
               justify-content: center;
               align-items: center;
          }
          .popout.show {
               display: flex;
          }

          .popout-box {
               background: #fff;
               color: #222;
               padding: 30px;
               border-radius: 12px;
               max-width: 500px;
               width: 90%;
               position: relative;
               text-align: center;
          }
          .close-btn {
               position: absolute;
               top: 8px;
               right: 12px;
               background: none;
               border: none;
               font-size: 28px;
               cursor: pointer;
               line-height: 1;
          }
          body {
               background-image: url("hsrbg.jpg");
               font-family: "Indie Flower", cursive;
               background-repeat: no-repeat;
               background-size: cover;
               background-position: center;
               background-attachment: fixed;
          }
          body::before {
               inset: 0;
               z-index: -1;
               content: "";
               background: rgba(0,0,0,0.65);
               position: fixed;
          }
          .background-bag {
               border: 2px solid #222;
               border-radius: 8px;
               padding: 20px;
               min-height: 120px;
               display: flex;
               flex-wrap: wrap;
               gap: 12px;
               align-items: flex-start;
               justify-content: center;
          }
          .background-bag img {
               width: 150px;
               height: 104px;
               object-fit: contain;
               cursor: pointer;
               transition: transform 0.2s ease;
          }
          .background-bag img:hover {
               transform: scale(1.15);
          }

     </STYLE>
     </head>
     <body>
          <button class = "img-btn" id = "openPopout">
               <img src = "bag.png" alt = "bag">
          </button>

          <div class = "popout" id = "popout">
               <div class ="popout-box">
                    <button class = "close-btn" id = "closePopout">&times;</button>
                    <h3> BAG </h3>
                    <p> BACKGROUNDS </p>
                   <div class = "background-bag">
                    <img src="amphorous.jpg" data-bg="amphorous.jpg" alt="amphorous">
                    <img src="beblog.jpg" data-bg="beblog.jpg" alt="beblog">
                    <img src="The Xianzhou Luofu.jpg" data-bg="The Xianzhou Luofu.jpg" alt="The Xianzhou Luofu">
                    <img src="penacony.jpg" data-bg="penacony.jpg" alt="penacony">
                    <img src="hertastation.jpg" data-bg="hertastation.jpg" alt="hertastation">
                    <img src="Planarcadia.jpg" data-bg="Planarcadia.jpg" alt="Planarcadia">
                    </div>
               </div>
          </div>
     <script>
          const popout= document.getElementById("popout");
          document.getElementById("openPopout").onclick = () => popout.classList.add("show");
          document.getElementById("closePopout").onclick = () => popout.classList.remove("show");
          
          popout.onclick = (e) => {
               if (e.target === popout) popout.classList.remove("show");
          };

          const bgImages = document.querySelectorAll(".background-bag img");
          bgImages.forEach((img) => {
               img.addEventListener("click", () => {
                    const chosen = img.dataset.bg;
                    document.body.style.backgroundImage = `url("${chosen}")`;
                    localStorage.setItem("selectedBg", chosen);
                    popout.classList.remove("show");
               });
          });

          const savedBg = localStorage.getItem("selectedBg");
          if (savedBg) {
               document.body.style.backgroundImage = `url("${savedBg}")`;
          }

     
     </script>
     </body>

</htrml>
